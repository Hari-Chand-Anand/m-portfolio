<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HCA Assistant</title>
  <link href="https://fonts.cdnfonts.com/css/ikaros" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css" />
  <style>
    :root {
      --chat-user-bg: rgba(106,166,255,.18);
      --chat-bot-bg: rgba(255,255,255,.04);
      --input-bg: rgba(255,255,255,.06);
    }

    html, body { height: 100%; margin: 0; overflow: hidden; }

    body {
      display: flex;
      flex-direction: column;
      background: var(--bg);
      font-family: var(--font-ui);
    }

    /* ── Header ── */
    .rag-header {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 24px;
      border-bottom: 1px solid var(--border);
      background: rgba(15,27,51,.7);
      backdrop-filter: blur(14px);
    }

    .rag-header a {
      color: var(--muted);
      font-size: 18px;
      line-height: 1;
      text-decoration: none;
      transition: color .15s;
    }
    .rag-header a:hover { color: var(--text); }

    .rag-header-title {
      display: flex;
      flex-direction: column;
    }
    .rag-header-title strong {
      font-size: 15px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text);
    }
    .rag-header-title span {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 1px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4ade80;
      margin-left: auto;
      box-shadow: 0 0 6px #4ade80aa;
    }

    /* ── Messages ── */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      scroll-behavior: smooth;
    }

    .messages::-webkit-scrollbar { width: 4px; }
    .messages::-webkit-scrollbar-track { background: transparent; }
    .messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,.1); border-radius: 4px; }

    /* ── Message rows ── */
    .msg-row {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-width: 820px;
      width: 100%;
    }

    .msg-row.user { align-self: flex-end; align-items: flex-end; }
    .msg-row.bot  { align-self: flex-start; align-items: flex-start; }

    .bubble {
      padding: 12px 16px;
      border-radius: 14px;
      font-size: 14px;
      line-height: 1.6;
      max-width: 620px;
    }

    .msg-row.user .bubble {
      background: var(--chat-user-bg);
      border: 1px solid rgba(106,166,255,.25);
      color: var(--text);
      border-bottom-right-radius: 4px;
    }

    .msg-row.bot .bubble {
      background: var(--chat-bot-bg);
      border: 1px solid var(--border);
      color: var(--text);
      border-bottom-left-radius: 4px;
    }

    .bubble.thinking {
      color: var(--muted);
      font-style: italic;
    }

    /* ── Cards container ── */
    .cards-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      max-width: 820px;
    }

    /* ── Machine card ── */
    .machine-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      width: 220px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: border-color .15s, transform .15s;
    }

    .machine-card:hover {
      border-color: rgba(106,166,255,.35);
      transform: translateY(-2px);
    }

    .mc-brand {
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--brand);
      font-weight: 600;
    }

    .mc-model {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      line-height: 1.3;
    }

    .mc-category {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 20px;
      font-size: 10px;
      background: rgba(106,166,255,.12);
      color: var(--brand);
      letter-spacing: .5px;
      text-transform: capitalize;
      width: fit-content;
    }

    .mc-desc {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .mc-actions {
      margin-top: auto;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .mc-link {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 11px;
      letter-spacing: .5px;
      background: rgba(106,166,255,.1);
      color: var(--brand);
      border: 1px solid rgba(106,166,255,.2);
      text-align: center;
      transition: background .15s;
    }
    .mc-link:hover { background: rgba(106,166,255,.2); }

    .mc-link-yt {
      background: rgba(255,80,80,.08);
      color: #f87171;
      border-color: rgba(255,80,80,.2);
    }
    .mc-link-yt:hover { background: rgba(255,80,80,.16); }

    /* ── Project card ── */
    .project-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      width: 240px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: border-color .15s, transform .15s;
    }
    .project-card:hover {
      border-color: rgba(106,166,255,.35);
      transform: translateY(-2px);
    }
    .pj-label {
      font-size: 9px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 600;
    }
    .pj-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      line-height: 1.3;
    }

    /* ── Price card ── */
    .price-card {
      background: var(--card);
      border: 1px solid rgba(106,166,255,.2);
      border-radius: var(--radius);
      padding: 20px 24px;
      min-width: 220px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .pc-model {
      font-size: 12px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--muted);
    }

    .pc-price {
      font-size: 28px;
      font-weight: 700;
      color: var(--brand);
      letter-spacing: -0.5px;
    }

    .pc-source {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 10px;
      color: #4ade80;
      letter-spacing: .5px;
    }

    .pc-source::before {
      content: '';
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #4ade80;
      box-shadow: 0 0 4px #4ade80;
      flex-shrink: 0;
    }

    /* ── Welcome / suggestions ── */
    .welcome {
      align-self: center;
      text-align: center;
      padding: 40px 20px;
      max-width: 540px;
    }

    .welcome h2 {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text);
      margin: 0 0 8px;
    }

    .welcome p {
      font-size: 13px;
      color: var(--muted);
      margin: 0 0 28px;
      line-height: 1.6;
    }

    .suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }

    .suggestion {
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 12px;
      color: var(--brand);
      border: 1px solid rgba(106,166,255,.25);
      background: rgba(106,166,255,.06);
      cursor: pointer;
      transition: background .15s, border-color .15s;
      letter-spacing: .3px;
    }

    .suggestion:hover {
      background: rgba(106,166,255,.14);
      border-color: rgba(106,166,255,.45);
    }

    /* ── Input area ── */
    .input-area {
      flex-shrink: 0;
      padding: 14px 20px;
      border-top: 1px solid var(--border);
      background: rgba(11,18,32,.85);
      backdrop-filter: blur(14px);
    }

    .input-wrap {
      max-width: 820px;
      margin: 0 auto;
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

    #user-input {
      flex: 1;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 14px;
      color: var(--text);
      font-family: var(--font-ui);
      resize: none;
      outline: none;
      line-height: 1.5;
      min-height: 46px;
      max-height: 140px;
      transition: border-color .15s;
    }

    #user-input:focus { border-color: rgba(106,166,255,.4); }
    #user-input::placeholder { color: var(--muted); }

    #send-btn {
      background: var(--brand);
      border: none;
      border-radius: 12px;
      width: 46px;
      height: 46px;
      cursor: pointer;
      color: #050b1c;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: opacity .15s;
    }

    #send-btn:disabled { opacity: .4; cursor: default; }
    #send-btn:not(:disabled):hover { opacity: .85; }

    /* ── Scrolled messages center ── */
    .messages-inner {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 20px;
      max-width: 820px;
      width: 100%;
      margin: 0 auto;
    }

    /* ── Thread controls ── */
    .turn-badge {
      display: none;
      align-items: center;
      gap: 5px;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 10px;
      letter-spacing: .8px;
      color: var(--muted);
      border: 1px solid var(--border);
      background: rgba(255,255,255,.03);
      white-space: nowrap;
    }
    .turn-badge.visible { display: flex; }
    .turn-badge::before {
      content: '';
      width: 5px; height: 5px;
      border-radius: 50%;
      background: var(--brand);
      opacity: .6;
      flex-shrink: 0;
    }

    #new-chat-btn {
      display: none;
      align-items: center;
      gap: 5px;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 11px;
      letter-spacing: .5px;
      color: var(--muted);
      border: 1px solid var(--border);
      background: transparent;
      cursor: pointer;
      font-family: var(--font-ui);
      transition: color .15s, border-color .15s, background .15s;
      white-space: nowrap;
    }
    #new-chat-btn.visible { display: flex; }
    #new-chat-btn:hover {
      color: var(--text);
      border-color: rgba(255,255,255,.2);
      background: rgba(255,255,255,.04);
    }

    /* ── Resume notice on welcome ── */
    .resume-notice {
      display: none;
      align-items: center;
      gap: 8px;
      margin: -16px auto 20px;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 11px;
      color: var(--brand);
      border: 1px solid rgba(106,166,255,.2);
      background: rgba(106,166,255,.06);
      letter-spacing: .4px;
      max-width: fit-content;
    }
    .resume-notice.visible { display: flex; }
    .resume-notice::before {
      content: '';
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--brand);
      box-shadow: 0 0 5px var(--brand);
      flex-shrink: 0;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="rag-header">
    <a href="index.html" title="Back">&#8592;</a>
    <div class="rag-header-title">
      <strong>HCA Assistant</strong>
      <span>Catalog · Specs · Live Prices</span>
    </div>
    <span class="turn-badge" id="turn-badge"></span>
    <button id="new-chat-btn" title="Start a new conversation">+ New Chat</button>
    <div class="status-dot" title="AI online"></div>
  </header>

  <!-- Messages -->
  <div class="messages" id="messages">
    <div class="messages-inner" id="messages-inner">

      <div class="welcome" id="welcome">
        <h2>HCA Assistant</h2>
        <p id="welcome-sub">Ask me about machines, specifications, or get live prices straight from the catalog.</p>
        <div class="resume-notice" id="resume-notice"></div>
        <div class="suggestions">
          <button class="suggestion" data-q="Show me embroidery machines">Embroidery machines</button>
          <button class="suggestion" data-q="What lockstitch machines do you have?">Lockstitch machines</button>
          <button class="suggestion" data-q="Show me DUKE machines">DUKE catalog</button>
          <button class="suggestion" data-q="Show me overlock machines">Overlock machines</button>
          <button class="suggestion" data-q="What is the price of DY-1201?">Price of DY-1201</button>
          <button class="suggestion" data-q="Show me button hole machines">Button hole machines</button>
        </div>
      </div>

    </div>
  </div>

  <!-- Input -->
  <div class="input-area">
    <div class="input-wrap">
      <textarea id="user-input" rows="1" placeholder="Ask about machines or prices…"></textarea>
      <button id="send-btn" title="Send">&#9650;</button>
    </div>
  </div>

  <script>
    const API = 'http://localhost:3001';
    let history  = [];
    let threadId = localStorage.getItem('hca_thread_id') || null;
    let turnCount = parseInt(localStorage.getItem('hca_turns') || '0', 10);
    let busy = false;

    const messagesInner = document.getElementById('messages-inner');
    const messagesEl    = document.getElementById('messages');
    const inputEl       = document.getElementById('user-input');
    const sendBtn       = document.getElementById('send-btn');
    const welcome       = document.getElementById('welcome');
    const turnBadge     = document.getElementById('turn-badge');
    const newChatBtn    = document.getElementById('new-chat-btn');
    const resumeNotice  = document.getElementById('resume-notice');

    // Auto-resize textarea
    inputEl.addEventListener('input', () => {
      inputEl.style.height = 'auto';
      inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + 'px';
    });

    // Enter to send (Shift+Enter = newline)
    inputEl.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
    });

    sendBtn.addEventListener('click', send);

    // Restore thread state on load
    if (threadId && turnCount > 0) {
      updateThreadUI();
      resumeNotice.textContent = `Resuming previous session · ${turnCount} turn${turnCount !== 1 ? 's' : ''}`;
      resumeNotice.classList.add('visible');
    }

    // New chat
    newChatBtn.addEventListener('click', () => {
      if (!confirm('Start a new conversation? This will clear the current session.')) return;
      threadId  = null;
      turnCount = 0;
      localStorage.removeItem('hca_thread_id');
      localStorage.removeItem('hca_turns');
      location.reload();
    });

    function updateThreadUI() {
      turnBadge.textContent = `${turnCount} turn${turnCount !== 1 ? 's' : ''}`;
      turnBadge.classList.add('visible');
      newChatBtn.classList.add('visible');
    }

    // Suggestion chips
    document.querySelectorAll('.suggestion').forEach(btn => {
      btn.addEventListener('click', () => { inputEl.value = btn.dataset.q; send(); });
    });

    function scrollDown() {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function addUserBubble(text) {
      const row = document.createElement('div');
      row.className = 'msg-row user';
      row.innerHTML = `<div class="bubble">${escHtml(text)}</div>`;
      messagesInner.appendChild(row);
      scrollDown();
    }

    function addBotRow(text, cards) {
      const row = document.createElement('div');
      row.className = 'msg-row bot';

      if (text) {
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.innerHTML = formatText(text);
        row.appendChild(bubble);
      }

      if (cards && cards.length > 0) {
        const cardsRow = document.createElement('div');
        cardsRow.className = 'cards-row';
        cards.forEach(card => cardsRow.appendChild(buildCard(card)));
        row.appendChild(cardsRow);
      }

      messagesInner.appendChild(row);
      scrollDown();
      return row;
    }

    function addThinking() {
      const row = document.createElement('div');
      row.className = 'msg-row bot';
      row.innerHTML = `<div class="bubble thinking">Searching catalog…</div>`;
      messagesInner.appendChild(row);
      scrollDown();
      return row;
    }

    function buildCard(card) {
      if (card.type === 'price') {
        return buildPriceCard(card);
      }
      if (card.type === 'machine_list') {
        const frag = document.createDocumentFragment();
        card.machines.forEach(m => frag.appendChild(buildMachineCard(m)));
        const wrap = document.createElement('div');
        wrap.style.display = 'contents';
        wrap.appendChild(frag);
        return wrap;
      }
      if (card.type === 'machine_detail') {
        return buildMachineCard(card.machine);
      }
      if (card.type === 'project_list') {
        const frag = document.createDocumentFragment();
        card.projects.forEach(p => frag.appendChild(buildProjectCard(p)));
        const wrap = document.createElement('div');
        wrap.style.display = 'contents';
        wrap.appendChild(frag);
        return wrap;
      }
      return document.createElement('div');
    }

    function buildMachineCard(m) {
      const el = document.createElement('div');
      el.className = 'machine-card';
      // catalogUrl lives under media in products.json; handle both shapes
      const catUrl = (m.media && m.media.catalogUrl) || m.catalogUrl || '';
      const ytId   = (m.media && m.media.youtubeId)  || m.youtubeId  || '';
      const ytUrl  = ytId ? `https://www.youtube.com/watch?v=${encodeURIComponent(ytId)}` : '';
      el.innerHTML = `
        <div class="mc-brand">${escHtml(m.brand || '')}</div>
        <div class="mc-model">${escHtml(m.model || m.name || '')}</div>
        ${m.category ? `<div class="mc-category">${escHtml(m.category)}</div>` : ''}
        ${m.description ? `<div class="mc-desc">${escHtml(m.description)}</div>` : ''}
        ${catUrl || ytUrl ? `<div class="mc-actions">
          ${catUrl ? `<a class="mc-link" href="${escHtml(catUrl)}" target="_blank" rel="noopener">Catalog ↗</a>` : ''}
          ${ytUrl  ? `<a class="mc-link mc-link-yt" href="${escHtml(ytUrl)}" target="_blank" rel="noopener">▶ Video</a>` : ''}
        </div>` : ''}
      `;
      return el;
    }

    function buildProjectCard(p) {
      const el = document.createElement('div');
      el.className = 'project-card';
      const catUrl = p.catalogUrl || '';
      el.innerHTML = `
        <div class="pj-label">Manufacturing Line</div>
        <div class="pj-title">${escHtml(p.title || '')}</div>
        ${catUrl ? `<div class="mc-actions">
          <a class="mc-link" href="${escHtml(catUrl)}" target="_blank" rel="noopener">Catalog ↗</a>
        </div>` : ''}
      `;
      return el;
    }

    function buildPriceCard(card) {
      const el = document.createElement('div');
      el.className = 'price-card';
      const price = card.quote_price_inr != null
        ? '₹ ' + Number(card.quote_price_inr).toLocaleString('en-IN')
        : 'Price unavailable';
      el.innerHTML = `
        <div class="pc-model">${escHtml(card.model || '')}</div>
        <div class="pc-price">${price}</div>
        <div class="pc-source">Live · Google Sheets</div>
      `;
      return el;
    }

    // Basic markdown-ish: bold, line breaks
    function formatText(text) {
      return escHtml(text)
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/\n/g, '<br>');
    }

    function escHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    async function send() {
      const text = inputEl.value.trim();
      if (!text || busy) return;

      busy = true;
      sendBtn.disabled = true;
      inputEl.value = '';
      inputEl.style.height = 'auto';

      // Hide welcome on first message
      if (welcome) welcome.style.display = 'none';

      addUserBubble(text);
      const thinking = addThinking();

      try {
        const res = await fetch(`${API}/api/chat`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text, thread_id: threadId })
        });

        const data = await res.json();
        thinking.remove();

        if (data.error) {
          addBotRow('Sorry, something went wrong: ' + data.error, []);
        } else {
          threadId  = data.thread_id || threadId;
          history   = data.history   || [];
          turnCount = data.history_turns || turnCount + 1;
          localStorage.setItem('hca_thread_id', threadId);
          localStorage.setItem('hca_turns', turnCount);
          updateThreadUI();
          addBotRow(data.answer, data.cards || []);
        }
      } catch (err) {
        thinking.remove();
        addBotRow('Could not reach the server. Make sure the backend is running on port 3001.', []);
      }

      busy = false;
      sendBtn.disabled = false;
      inputEl.focus();
    }
  </script>

</body>
</html>
